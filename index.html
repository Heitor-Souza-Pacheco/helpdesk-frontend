<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/pages/index/style.css">
    <title>Login - HelpDesk</title>
</head>
<body>
    <div class="container">
        <div class="ladoEsquerdo">
            <h1 class="titulo">Login Page</h1>
            <p class="subtitulo">Comece sua jornada conosco!</p>
        </div>
        <div class="ladoDireito">
            <h2 class="descricao">Faça login na sua conta</h2>

            <div id="mensagemErro" class="mensagem-erro" style="display:none;"></div>

            <div class="input">
                <p class="label">E-mail</p>
                <input class="inputEntrada" type="email" id="email" placeholder="Digite seu e-mail">
            </div>
            <div class="input">
                <p class="label">Senha</p>
                <input class="inputEntrada" type="password" placeholder="Digite sua senha" id="senha">
                <input class="alterarVisivel" type="checkbox" onclick="toogle()">
                <button class="submit" id="btnEntrar" onclick="fazerLogin()">
                    <p id="btnEntrarTexto">Entrar</p>
                </button>
            </div>
            <div class="linkCadastro">
                <p>Não tem uma conta? <a href="cadastro.html">Clique aqui</a></p>
            </div>
        </div>
    </div>
</body>
<script src="./assets/js/global/api.js"></script>
<script src="./assets/js/pages/index/script.js"></script>
<script src="./assets/js/pages/index/login.js"></script>
</html>
