<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/pages/index/style.css">
    <title>Login in SistBank</title>
</head>
<body>
    <div class="container">
        <div class="ladoEsquerdo">
            <h1 class="titulo">Login Page</h1>
            <p class="subtitulo">Comece sua jornada conosco!</p>
        </div>
        <div class="ladoDireito">
            <h2 class="descricao">Faça login na sua conta</h2>
            <div class="input">
                <p class="label">Email</p>
                <input class="inputEntrada" type="email" placeholder="Digite seu email">
            </div>
            <div class="input">
                <p class="label">Senha</p>
                <input class="inputEntrada" type="password" placeholder="Digite sua senha" id="senha">
                <input class="alterarVisivel" type="checkbox" onclick="toogle()">
                <a href="home.html"><button class="submit"><p>Entrar</p></button></a>
            </div>
            <div class="linkCadastro">
                <p>Não tem uma conta? <a href="cadastro.html">Clique aqui</a></p>
            </div>
        </div>
    </div>
</body>
<script src="./assets/js/pages/index/script.js"></script>
</html>
