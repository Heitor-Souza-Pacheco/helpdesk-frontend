<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login in SistBank</title>
</head>
<body>
    <div class="container">
        <div class="ladoEsquerdo">
            <h1 class="titulo">Login Page</h1>
            <p class="subtitulo">Comece sua jornada conosco!</p>
        </div>
        <div class="ladoDireito">
            <h2 class="descricao">Faça login na sua conta</h2>
            <div class="input">
                <p class="label">Nome</p>
                <input type="text" placeholder="Digite seu nome">
            </div>
            <div class="input">
                <p class="label">Senha</p>
                <input type="password" placeholder="Digite sua senha">
                <input class="alterarVisivel" type="checkbox">
            </div>
        </div>
    </div>
</body>
</html>
